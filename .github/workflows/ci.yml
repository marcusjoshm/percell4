name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Non-blocking for now: the tree is not yet globally ruff-clean, so lint
  # findings are surfaced in the run but do not fail CI. Flip continue-on-error
  # to false once a dedicated ruff-cleanup pass lands.
  lint:
    name: Ruff lint (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install "ruff>=0.4"
      - name: ruff check
        run: ruff check src tests

  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Qt/X11 runtime libraries required by PyQt5 + napari under a virtual
      # framebuffer (the headless pattern documented in the README).
      - name: Install Qt/X11 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-cursor0
      # Install the CPU-only torch wheel first so cellpose does not pull the
      # multi-gigabyte CUDA build on a runner with no GPU.
      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install percell4 + test dependencies
        run: python -m pip install -e ".[flim,imagej]" pytest pytest-qt pytest-cov
      # `slow` tests download several-hundred-MB Cellpose weights from Hugging
      # Face; `gui` tests need an interactive display. Both are excluded here so
      # the gate stays fast and deterministic.
      - name: Run tests
        env:
          QT_API: pyqt5
        run: xvfb-run -a python -m pytest -m "not slow and not gui"
